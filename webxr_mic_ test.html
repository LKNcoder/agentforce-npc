
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Microphone Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #vr-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            z-index: 100;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 100;
        }

        #mic-button {
    position: absolute;
    bottom: 20px;
    right: 20px;
    padding: 12px 24px;
    background-color: #ff4081;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    z-index: 100;
}
    </style>
</head>
<body>
    <div id="info">WebXR Microphone Visualization<br>Allow microphone access when prompted</div>
    <button id="vr-button" style="display: none">Enter VR</button>
    <button id="mic-button">Enable Microphone</button>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/webxr/VRButton.js';
        
        let scene, camera, renderer;
        let audioContext, analyser, dataArray;
        let microphoneStream;
        let visualizer;
        const BAR_COUNT = 5;
        const BAR_WIDTH = 0.1;
        const BAR_GAP = 0.05;
        const MAX_HEIGHT = 2.0;
        
        // Initialize the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0.5);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            renderer.xr.addEventListener('sessionstart', setupMicrophone);
            document.body.appendChild(renderer.domElement);
            
            // Add VR button
            document.body.appendChild(VRButton.createButton(renderer));
            
            // Add some light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(0, 2, 2);
            scene.add(directionalLight);
            
            // Add a floor
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x222222,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            scene.add(floor);
            
            // Create audio visualization bars
            createVisualizer();
            
            // Set up audio context when user interacts
            document.getElementById('vr-button').addEventListener('click', setupMicrophone);
            document.getElementById('mic-button').addEventListener('click', setupMicrophone);
            window.addEventListener('resize', onWindowResize);
            
            // Start animation loop
            renderer.setAnimationLoop(animate);
        }
        
        function createVisualizer() {
            visualizer = new THREE.Group();
            visualizer.position.set(0, 1.2, -1);  // Position in front of user
            
            const bars = [];
            const totalWidth = BAR_COUNT * BAR_WIDTH + (BAR_COUNT - 1) * BAR_GAP;
            const startX = -totalWidth / 2 + BAR_WIDTH / 2;
            
            for (let i = 0; i < BAR_COUNT; i++) {
                const barGeometry = new THREE.BoxGeometry(BAR_WIDTH, 0.1, BAR_WIDTH);
                const barMaterial = new THREE.MeshStandardMaterial({ 
                    color: new THREE.Color(0.3 + 0.7 * (i / BAR_COUNT), 0.2, 0.7 - 0.5 * (i / BAR_COUNT)),
                    roughness: 0.5,
                    metalness: 0.8
                });
                const bar = new THREE.Mesh(barGeometry, barMaterial);
                bar.position.x = startX + i * (BAR_WIDTH + BAR_GAP);
                bar.position.y = 0.05;  // Half of initial height
                bars.push(bar);
                visualizer.add(bar);
            }
            
            visualizer.userData.bars = bars;
            scene.add(visualizer);
        }
        
        function setupMicrophone() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                    .then(handleMicrophoneSuccess)
                    .catch(error => {
                        console.error('Error accessing microphone:', error);
                    });
            } else {
                console.error('getUserMedia not supported in this browser');
            }
        }
        
        function handleMicrophoneSuccess(stream) {
            microphoneStream = stream;
            
            // Create audio context and analyzer
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 32;  // Keep this small for performance
            source.connect(analyser);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            console.log('Microphone access successful');
        }
        
        function updateVisualization() {
            if (!analyser || !visualizer || !visualizer.userData.bars) return;
            
            analyser.getByteFrequencyData(dataArray);
            const bars = visualizer.userData.bars;
            
            // Use a subset of the frequency data for the bars
            const step = Math.floor(dataArray.length / bars.length);
            
            for (let i = 0; i < bars.length; i++) {
                let value = 0;
                // Average a few neighboring values for smoother visualization
                for (let j = 0; j < step; j++) {
                    value += dataArray[i * step + j] || 0;
                }
                value /= step;
                
                // Scale the value (0-255) to a reasonable height
                const scaledHeight = (value / 255.0) * MAX_HEIGHT;
                const bar = bars[i];
                
                // Update bar height with a bit of smoothing
                const currentHeight = bar.scale.y * bar.geometry.parameters.height;
                const targetHeight = Math.max(0.1, scaledHeight);  // Minimum height of 0.1
                const smoothedHeight = currentHeight * 0.8 + targetHeight * 0.2;
                
                bar.scale.y = smoothedHeight / bar.geometry.parameters.height;
                bar.position.y = smoothedHeight / 2;  // Center the bar vertically
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            updateVisualization();
            renderer.render(scene, camera);
        }
        
        // Start the application
        init();
        
        // Show VR button once everything is loaded
        document.getElementById('vr-button').style.display = 'block';

        // Hide the mic button if not in VR mode
        setTimeout(() => {
         setupMicrophone();
        }, 1000);
    </script>
</body>
</html>
