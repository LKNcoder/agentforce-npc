<!DOCTYPE html>
<html>
<head>
    <title>Piper TTS Loading Test</title>
</head>
<body>
    <h2>Piper TTS Loading Test</h2>
    <button id="testLocal">Test Local Model</button>
    <button id="testCDN">Test CDN Model</button>
    <div id="results"></div>

    <script src="piper-tts-web.js"></script>
    <script>
        document.getElementById('testLocal').addEventListener('click', async () => {
            const startTime = performance.now();
            const results = document.getElementById('results');
            results.innerHTML = "Loading local model...";
            
            try {
                const piper = new PiperTTS();
                await piper.loadVoice("voices/en_US-libritts-low");
                
                const endTime = performance.now();
                results.innerHTML = `Local model loaded in ${((endTime - startTime)/1000).toFixed(2)} seconds`;
                
                // Test synthesis
                const audio = await piper.synthesize("This is a test of local model performance.");
                results.innerHTML += "<br>Synthesis complete!";
            } catch (e) {
                results.innerHTML = `Error: ${e.message}`;
                console.error(e);
            }
        });

        document.getElementById('testCDN').addEventListener('click', async () => {
            const startTime = performance.now();
            const results = document.getElementById('results');
            results.innerHTML = "Loading CDN model...";
            
            try {
                const piper = new PiperTTS();
                await piper.loadVoice("https://cdn.jsdelivr.net/npm/piper-tts-voices@latest/en_US-libritts-low/en_US-libritts-low");
                
                const endTime = performance.now();
                results.innerHTML = `CDN model loaded in ${((endTime - startTime)/1000).toFixed(2)} seconds`;
                
                // Test synthesis
                const audio = await piper.synthesize("This is a test of CDN model performance.");
                results.innerHTML += "<br>Synthesis complete!";
            } catch (e) {
                results.innerHTML = `Error: ${e.message}`;
                console.error(e);
            }
        });
    </script>
</body>
</html>
